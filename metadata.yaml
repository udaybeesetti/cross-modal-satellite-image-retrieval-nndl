---
# =============================================================================
# metadata.yaml — Pandoc Document Front-Matter
# =============================================================================
#
# PURPOSE:
#   This file is passed as the first argument to the pandoc command in build.sh.
#   It sets global document properties that appear in the compiled PDF:
#   title page, header/footer, bibliography settings, and page layout.
#
# HOW IT'S USED:
#   pandoc metadata.yaml sections/*.md --template=template.tex ...
#
# FIELDS:
#   title      : Main title on the PDF cover page
#   subtitle   : Subtitle shown below the main title
#   author     : Author name(s) shown on the cover page
#   date       : \today is a LaTeX command that inserts today's date at compile time
#   abstract   : Summary paragraph shown before the Table of Contents
#   geometry   : Page size and margins (a4paper = 210×297mm, margin=1in)
#   fontsize   : Base font size for body text (11pt is standard for articles)
#   linestretch: Line spacing multiplier (1.2 = slightly wider than single-spaced)
#   toc-depth  : How many heading levels appear in the Table of Contents
#                (2 = show H1 chapters AND H2 sections, but not H3 subsections)
#   bibliography: Path to the BibTeX file containing all references
#   csl        : Citation Style Language file — controls how citations are formatted
#                (ieee.csl = IEEE numbered style: [1], [2], etc.)
#   link-citations: If true, citation numbers in the PDF are clickable hyperlinks
# =============================================================================
title: "Cross-Modal Satellite Image Retrieval"
subtitle: "Semantic Alignment of Heterogeneous Active and Passive Sensors"
author: ""
date: "\\today"
abstract: |
  This research paper investigates cross-modal satellite image retrieval using paired Sentinel-1 SAR and Sentinel-2 optical imagery. A unified, modality-agnostic latent space is constructed via ConvNeXt-Tiny and Generalized Mean pooling. By integrating a multi-label Jaccard masked InfoNCE loss and frozen inductive validation centering, the system successfully neutralizes modality cone collapse and enables sub-millisecond retrieval across heterogeneous remote sensing domains.
geometry: "a4paper, margin=1in"
fontsize: 11pt
linestretch: 1.2
toc-depth: 2
bibliography: references.bib
csl: ieee.csl
link-citations: true
...